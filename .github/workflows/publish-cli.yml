name: Publish CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CLI
        run: pnpm --filter @dsh-fish/cli run test

      - name: Build plugin then CLI
        run: |
          pnpm --filter dsh-hub run build
          pnpm --filter @dsh-fish/cli run build

      - name: Publish
        run: pnpm --filter @dsh-fish/cli publish --access public --no-git-checks --provenance --report-summary
