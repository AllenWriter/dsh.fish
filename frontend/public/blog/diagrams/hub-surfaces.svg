<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="hub-title hub-desc"><title id="hub-title">One catalog feeding human and agent surfaces</title><desc id="hub-desc">Catalog data feeds the website, CLI, and hub plugin, while the same content tree generates HTML, Markdown, Atom, sitemaps, and llms.txt.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');</style><marker id="hub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#7867d9"/></marker></defs><rect width="960" height="540" fill="#faf9fc"/><text x="56" y="62" fill="#17151d" font-family="IBM Plex Sans,ui-sans-serif,system-ui" font-size="26" font-weight="700">One source, several ways in</text><g font-family="IBM Plex Sans,ui-sans-serif,system-ui"><rect x="340" y="170" width="280" height="170" fill="#17151d"/><text x="380" y="215" fill="#fff" font-size="20" font-weight="700">dsh.fish catalog</text><text x="380" y="251" fill="#d7d2df" font-size="14">artifacts + install plans</text><text x="380" y="280" fill="#d7d2df" font-size="14">docs + editorial MDX</text><text x="380" y="313" fill="#a99dea" font-size="14" font-weight="700">shared source of truth</text><path d="M340 218H235M340 292H235M620 218H725M620 292H725" stroke="#7867d9" stroke-width="3" marker-end="url(#hub-arrow)"/><rect x="56" y="170" width="179" height="96" fill="#fff" stroke="#d8d4df"/><text x="78" y="207" fill="#17151d" font-size="17" font-weight="700">Human surfaces</text><text x="78" y="237" fill="#68636f" font-size="14">website + docs</text><rect x="56" y="292" width="179" height="96" fill="#fff" stroke="#d8d4df"/><text x="78" y="329" fill="#17151d" font-size="17" font-weight="700">Install clients</text><text x="78" y="359" fill="#68636f" font-size="14">CLI + hub plugin</text><rect x="725" y="170" width="179" height="96" fill="#eeeafd" stroke="#7867d9"/><text x="747" y="207" fill="#17151d" font-size="17" font-weight="700">Web delivery</text><text x="747" y="237" fill="#68636f" font-size="14">HTML + Atom</text><rect x="725" y="292" width="179" height="96" fill="#eeeafd" stroke="#7867d9"/><text x="747" y="329" fill="#17151d" font-size="17" font-weight="700">Agent delivery</text><text x="747" y="359" fill="#68636f" font-size="14">Markdown + llms.txt</text><text x="56" y="467" fill="#68636f" font-size="14">The useful property is consistency: every surface reads the same plan or content tree.</text></g></svg>

