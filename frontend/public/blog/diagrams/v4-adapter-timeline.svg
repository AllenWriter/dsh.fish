<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="v4-title v4-desc"><title id="v4-title">From the V4 announcement to the Harness adapter</title><desc id="v4-desc">A timeline connects the V4 model announcement to native image requests, Files API reuse, plugin identity, and retirement of old model aliases.</desc><defs><style>@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');</style></defs><rect width="960" height="540" fill="#faf9fc"/><text x="56" y="62" fill="#17151d" font-family="IBM Plex Sans,ui-sans-serif,system-ui" font-size="26" font-weight="700">The model launch changed the adapter in stages</text><path d="M100 272H860" stroke="#cbc6d2" stroke-width="3"/><g font-family="IBM Plex Sans,ui-sans-serif,system-ui"><g fill="#7867d9"><circle cx="135" cy="272" r="9"/><circle cx="350" cy="272" r="9"/><circle cx="565" cy="272" r="9"/><circle cx="780" cy="272" r="9"/></g><text x="96" y="230" fill="#17151d" font-size="16" font-weight="700">V4 Preview</text><text x="96" y="309" fill="#68636f" font-size="13">1M context</text><text x="96" y="331" fill="#68636f" font-size="13">Pro + Flash</text><text x="306" y="230" fill="#17151d" font-size="16" font-weight="700">Native images</text><text x="306" y="309" fill="#68636f" font-size="13">vision requests</text><text x="306" y="331" fill="#68636f" font-size="13">file references</text><text x="522" y="230" fill="#17151d" font-size="16" font-weight="700">Files API</text><text x="522" y="309" fill="#68636f" font-size="13">upload reuse</text><text x="522" y="331" fill="#68636f" font-size="13">resize + convert</text><text x="734" y="230" fill="#17151d" font-size="16" font-weight="700">Plugin identity</text><text x="734" y="309" fill="#68636f" font-size="13">names + versions</text><text x="734" y="331" fill="#68636f" font-size="13">optional logs</text><rect x="56" y="390" width="848" height="72" fill="#17151d"/><text x="82" y="420" fill="#fff" font-size="15" font-weight="700">Migration boundary</text><text x="82" y="446" fill="#d7d2df" font-size="14">deepseek-chat and deepseek-reasoner retired; use deepseek-v4-pro or deepseek-v4-flash</text></g></svg>

